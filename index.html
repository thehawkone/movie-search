<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header class="header">
        <div class="header__content wrapper">
            <a href="#" class="header__logo">Movie Search</a>
            <nav class="header__nav" aria-label="Основная навигация">
                <button type="button" class="nav__btn" id="search-btn">Поиск</button>
                <button type="button" class="nav__btn" id="favorites-btn">Избранное</button>
            </nav>
        </div>
    </header>

    <main>
        <div class="main__content wrapper">
            
            <section class="search-view" id="search-view">
                <form class="search-form" id="search-form">
                    <input type="text" placeholder="Введите название фильма" id="search-input">
                    <button type="submit" class="search-btn">Поиск</button>
                </form>

                <p class="message message--loading" id="loading" hidden>Загрузка...</p>
                <p class="message message--error" id="error" hidden>Лол че то сломалось</p>
                <p class="message message--no-results" id="no-results" hidden>Ничего не найдено</p>

                <div class="movie-grid" id="movie-grid">
                </div>
            </section>


            <section class="details-view" id="details-view" hidden>
                <div class="movie-details">
                    <button type="button" class="details-btn" id="back-btn">Назад</button>
                    <div class="movie-info">
                        <img src="" alt="" class="movie-info__poster" id="detail-poster">
                        <div class="movie-info__content">
                            <h3 class="movie-info__title" id="detail-title"></h3>
                            <p class="movie-info__rating" id="detail-rating"></p>
                            <p class="movie-info__director" id="detail-director"></p>
                            <p class="movie-info__actors" id="detail-actors"></p>
                            <p class="movie-info__year" id="detail-year"></p>
                            <p class="movie-info__genre" id="detail-genre"></p>
                            <p class="movie-info__plot" id="detail-plot"></p>
                        </div>
                    </div>
                    <button type="button" class="movie-card__btn-favorite" id="favorite-btn">Добавить в избранное</button>
                </div>
            </section>


            <section class="favorites-view" id="favorites-view" hidden>
                <div class="favorites-grid" id="favorites-grid">
                </div>
            </section>

        </div>
    </main>

    <script src="js/app.js" type="module"></script>
</body>
</html>
